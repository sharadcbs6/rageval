[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-platform"
version = "0.1.0"
description = "RAG evaluation platform with Ragas, DeepEval, Neo4j, LangChain, and FastAPI"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",

    # LangChain ecosystem
    "langchain==0.3.25",
    "langchain-community==0.3.24",
    "langchain-openai==0.3.16",
    "langchain-chroma==0.2.4",
    "langgraph==0.3.34",

    # Vector store
    "chromadb==0.5.3",

    # Neo4j
    "neo4j==5.20.0",
    "langchain-neo4j==0.1.0",

    # Embeddings / LLM
    "openai==1.30.5",
    "tiktoken==0.7.0",

    # Evaluation
    "ragas==0.4.3",
    "deepeval==4.3.2",

    # Utilities
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "tenacity==8.3.0",
    "structlog==24.2.0",
    "datasets==3.2.0",
    "pandas==2.2.3",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.8",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
